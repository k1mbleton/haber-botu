etiket = "Son Dakika"
url = ["son-dakika", "sondakika", "son-dakika-haberleri", "flas-haber", "breaking-news"]
kelime = ["son dakika", "flaş", "flaş gelişme*", "sıcak gelişme*", "breaking"]

