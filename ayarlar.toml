# ============================================================
#  HABER BOTU AYARLARI
#  Bu dosyayı GitHub'da düzenleyip kaydetmeniz yeterli;
#  bir sonraki çalışmada (en geç 15 dk) geçerli olur.
# ============================================================

[genel]
# Hangi kategoriler Telegram'a gönderilsin? (aşağıdaki [kategori.*] adlarından)
# Örn. medya haberlerini de istersen listeye "medya" ekle.
takip_edilen = ["son_dakika", "siyaset", "ekonomi", "borsa", "spor"]

# Bot her çalıştığında tamamlanmış son 15 dakikalık aralığı işler
# (ör. 13:32'de çalışırsa 13:15-13:30 arasında yayımlanan haberler) ve
# her aralığın başına "13:15 – 13:30 Ana Haberleri" başlık mesajı atar.

# Özetin en fazla kaç karakter olacağı
ozet_max_karakter = 100

# Takip edilen konularda haber çıkmayan aralıklar için de başlık atılsın mı?
# (false: gece gibi sakin saatlerde boş başlık mesajı gelmez)
bos_araligi_bildir = false

# GitHub bir turu atlarsa en fazla kaç aralık geriye dönülsün (4 = 1 saat)
max_geriye_aralik = 4

# Yayına geç düşen haberler (özellikle Google Haberler üzerinden gelenler)
# kendi aralığı geçmiş olsa bile bu süreye kadar bir sonraki aralıkta gönderilir.
max_haber_yasi_dk = 120

# Bir turda en fazla kaç ayrı mesaj gönderilsin? Fazlası tek bir
# "Diğer haberler" listesinde toplanır (Telegram'ı boğmamak için).
max_mesaj = 30

# Mesajlar arası bekleme (sn). Özel mesaj için 1.5 yeterli,
# grup/kanal kullanırsan 3 yap (Telegram hız sınırı).
mesaj_arasi_sn = 1.5

# Aynı olayı farklı sitelerden tek mesajda birleştirme hassasiyeti (0-1).
# Yükseltirsen daha az birleştirir.
benzerlik_esigi = 0.5

link_onizleme = true

# ANTHROPIC_API_KEY tanımlıysa özet başlık + özet Claude ile yazılır.
# Tanımlı değilse sitenin kendi başlığı ve spot metni kullanılır (ücretsiz).
claude_kullan = true
claude_model = "claude-haiku-5-5"

# Linkin ilk iki parçasında bunlar geçen haberler tamamen atlanır.
haric_url = [
  "magazin", "foto-galeri", "video-galeri", "galeri", "video", "videolar",
  "yazarlar", "yazar", "kose-yazilari", "astroloji", "burclar", "saglik",
  "yasam", "kadin", "kultur-sanat", "yemek", "seyahat", "otomobil",
  "ilan", "resmi-ilanlar", "yerel", "advertorial", "hava-durumu",
]

# Kategoriler önemli -> önemsiz sırasıyla; bir haber birden fazlasına
# uyarsa listede önce geleni alır.
oncelik = ["borsa", "ekonomi", "siyaset", "spor", "dunya", "medya", "gundem"]


# ------------------------------------------------------------
#  KATEGORİLER
#  url   : linkteki bölüm adı (ör. https://site.com/spor/... -> "spor")
#  kelime: başlıkta aranır. Sonunda * olan kelime ek alabilir
#          (bakan* -> bakanı, bakanlık). * yoksa tam kelime aranır.
# ------------------------------------------------------------

[kategori.son_dakika]
etiket = "Son Dakika"
url = ["son-dakika", "sondakika", "son-dakika-haberleri", "flas-haber"]
kelime = ["son dakika", "flaş", "flaş gelişme*", "sıcak gelişme*"]

