# ============================================================
#  HABER BOTU AYARLARI
#  Bu dosyayı GitHub'da düzenleyip kaydetmeniz yeterli;
#  bir sonraki çalışmada (en geç 30 dk) geçerli olur.
# ============================================================

[genel]
# Hangi konular Telegram'a gönderilsin? (aşağıdaki [kategori.*] adlarından)
takip_edilen = [
  "son_dakika", "siyaset", "dunya", "ekonomi", "borsa", "sirketler",
  "teknoloji", "spor", "magazin",
]

# Aralık uzunluğu (dakika). Bot her çalıştığında tamamlanmış son aralığı işler
# (ör. 14:02'de çalışırsa 13:30-14:00 arasında yayımlanan haberler) ve her aralığın
# başına "13:30 – 14:00 Ana Haberleri" başlık mesajı atar.
# Değiştirirsen .github/workflows/haber-botu.yml içindeki cron satırını da uydur.
aralik_dk = 30

# Özet uzunluğu (kelime). Claude API anahtarı varsa haberin tam metninden bu
# uzunlukta Türkçe özet yazılır, yabancı haberler Türkçeye çevrilir.
# Anahtar yoksa haber metninin ilk ~250 kelimesi gönderilir (çeviri yapılmaz).
ozet_kelime_min = 200
ozet_kelime_max = 300
makale_metni_max = 6000

# Takip edilen konularda haber çıkmayan aralıklar için de başlık atılsın mı?
bos_araligi_bildir = false

# GitHub bir turu atlarsa en fazla kaç aralık geriye dönülsün (2 = 1 saat)
max_geriye_aralik = 2

# Yayına geç düşen haberler (özellikle Google Haberler üzerinden gelenler)
# kendi aralığı geçmiş olsa bile bu süreye kadar bir sonraki aralıkta gönderilir.
max_haber_yasi_dk = 120

# Bir aralıkta en fazla kaç haber ayrı mesaj (uzun özetli) olarak gönderilsin?
# Öncelik: son dakika > birden çok sitede çıkan > yerli > erken yayımlanan.
# Fazlası tek bir "Diğer haberler" listesinde başlık + link olarak gelir.
max_mesaj = 30
# "Diğer haberler" listesine en fazla kaç başlık girsin (gerisi gönderilmez)
max_liste = 40

# Mesajlar arası bekleme (sn). Özel mesaj için 1.5 yeterli, grup/kanal için 3.
mesaj_arasi_sn = 1.5

# Aynı olayı farklı sitelerden tek mesajda birleştirme hassasiyeti (0-1).
benzerlik_esigi = 0.5

link_onizleme = true

# Claude ile özet/çeviri (GitHub'da ANTHROPIC_API_KEY gizli değişkeni gerekir)
claude_kullan = true
claude_model = "claude-haiku-5-5"
# Maliyet sigortası: günde en fazla kaç haber Claude ile özetlensin
claude_gunluk_limit = 800

# Linkin ilk iki bölümünde bunlar geçen haberler tamamen atlanır.
haric_url = [
  "foto-galeri", "video-galeri", "galeri", "video", "videolar", "videos", "av",
  "yazarlar", "yazar", "kose-yazilari", "opinion", "commentisfree", "podcasts",
  "live", "in-pictures", "gallery", "newsletters", "astroloji", "burclar",
  "saglik", "yasam", "kadin", "yemek", "seyahat", "otomobil", "ilan",
  "resmi-ilanlar", "yerel", "advertorial", "hava-durumu",
]

# Bir haber birden fazla konuya uyarsa listede önce gelen seçilir.
oncelik = ["borsa", "sirketler", "ekonomi", "teknoloji", "dunya", "siyaset", "spor", "magazin", "medya", "gundem"]


# ------------------------------------------------------------
#  KATEGORİLER
#  url   : linkteki bölüm adı (ör. https://site.com/spor/... -> "spor")
#  kelime: başlıkta aranır. Sonunda * olan kelime ek alabilir
#          (bakan* -> bakanı, bakanlık). * yoksa tam kelime aranır.
#  Hiçbiri uymazsa kaynağın kendi "kategori" değeri kullanılır.
# ------------------------------------------------------------

